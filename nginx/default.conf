# Temporary files go to /tmp, so the image also runs as a non-root user that doesn't own /var/cache/nginx
# (a factory preview runs it as uid 2000 with no capabilities).
client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

# index.html points at hashed bundles that change with every image. Without an explicit
# policy, browsers cache it heuristically (from Last-Modified, which is the image build
# time) and keep booting the previous release's bundle after an image upgrade.
map $sent_http_content_type $cache_control {
    ~^text/html  "no-cache";
}

server {
    # 8080, not 80: a non-root user can't listen below 1024.
    listen       8080;
    server_name  localhost;
    root   /app/dashboard/;

    add_header Referrer-Policy origin-when-cross-origin;
    add_header Cache-Control $cache_control;

    location / {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    location /dashboard/ {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
